<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">System behind the BYD plant's revenue meter</title>
  <desc id="d">The grid supplies the plant through one revenue meter. Behind the meter, the plant load, a 60 MW / 240 MWh battery and 10 MW of rooftop solar share the plant's 10 kV buses. The battery must respect the plant's power-quality alarm limits and keep a backup reserve, and its savings are shared with the plant.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5e5a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" rx="10" fill="#fbfaf7"/>

  <!-- behind-the-meter boundary -->
  <rect x="215" y="22" width="528" height="236" rx="8" fill="none" stroke="#b4b2a9" stroke-dasharray="5 4"/>
  <text x="229" y="42" font-size="12" fill="#5f5e5a">Behind the meter</text>

  <!-- grid -->
  <rect x="20" y="105" width="130" height="66" rx="6" fill="#f1efe8" stroke="#888780"/>
  <text x="85" y="132" font-size="14" font-weight="600" fill="#2c2c2a" text-anchor="middle">Grid</text>
  <text x="85" y="152" font-size="11.5" fill="#5f5e5a" text-anchor="middle">Time-of-use tariff</text>
  <text x="85" y="166" font-size="11.5" fill="#5f5e5a" text-anchor="middle">+ demand charge</text>

  <!-- meter -->
  <line x1="150" y1="138" x2="197" y2="138" stroke="#5f5e5a" stroke-width="2"/>
  <circle cx="215" cy="138" r="17" fill="#fff" stroke="#5f5e5a" stroke-width="1.5"/>
  <text x="215" y="143" font-size="13" font-weight="600" fill="#2c2c2a" text-anchor="middle">M</text>
  <text x="215" y="178" font-size="11" fill="#5f5e5a" text-anchor="middle">Revenue</text>
  <text x="215" y="191" font-size="11" fill="#5f5e5a" text-anchor="middle">meter</text>

  <!-- bus -->
  <line x1="232" y1="138" x2="430" y2="138" stroke="#2c2c2a" stroke-width="5" stroke-linecap="round"/>
  <text x="330" y="126" font-size="11.5" fill="#5f5e5a" text-anchor="middle">Plant 10 kV buses</text>

  <!-- plant -->
  <path d="M430,138 L470,138 L470,82 L505,82" fill="none" stroke="#5f5e5a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="507" y="50" width="220" height="66" rx="6" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="617" y="76" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">BYD battery plant</text>
  <text x="617" y="96" font-size="11.5" fill="#0f6e56" text-anchor="middle">~60 MW, nearly flat around the clock</text>

  <!-- battery -->
  <path d="M470,138 L470,196 L505,196" fill="none" stroke="#5f5e5a" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="507" y="163" width="220" height="66" rx="6" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="617" y="189" font-size="14" font-weight="600" fill="#0c447c" text-anchor="middle">Battery 60 MW / 240 MWh</text>
  <text x="617" y="209" font-size="11.5" fill="#185fa5" text-anchor="middle">4 hours at full power</text>

  <!-- solar -->
  <path d="M330,215 L330,145" fill="none" stroke="#5f5e5a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="265" y="215" width="130" height="34" rx="6" fill="#faeeda" stroke="#854f0b"/>
  <text x="330" y="237" font-size="12.5" font-weight="600" fill="#633806" text-anchor="middle">Rooftop solar 10 MWp</text>

  <!-- constraints and contract -->
  <text x="20" y="284" font-size="12" font-weight="600" fill="#2c2c2a">Operating limits</text>
  <text x="20" y="302" font-size="11.5" fill="#444441">• Charge and discharge power capped below the plant's power-quality alarm thresholds</text>
  <text x="20" y="318" font-size="11.5" fill="#444441">• A backup reserve so production can continue through peak-season grid curtailments</text>
  <text x="560" y="284" font-size="12" font-weight="600" fill="#2c2c2a">Contract</text>
  <text x="560" y="302" font-size="11.5" fill="#444441">Shared savings: the plant buys</text>
  <text x="560" y="318" font-size="11.5" fill="#444441">battery energy below the grid price</text>
</svg>
